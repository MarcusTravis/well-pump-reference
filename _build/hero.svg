<svg class="hero-svg" viewBox="0 0 1200 420" preserveAspectRatio="xMaxYMid slice" aria-hidden="true">
  <defs>
    <linearGradient id="hsky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a2236"/>
      <stop offset="40%" stop-color="#071622"/>
      <stop offset="100%" stop-color="#050d16"/>
    </linearGradient>
    <linearGradient id="hwater" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3fc1c9" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#3fc1c9" stop-opacity="0.04"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="420" fill="url(#hsky)"/>
  <!-- ground line and soil strata -->
  <g fill="none" stroke="#8fb4c8" stroke-width="1.2">
    <path d="M0,120 L1200,120" stroke-opacity="0.5"/>
    <path d="M0,170 C200,160 400,182 600,172 S1000,166 1200,174" stroke-opacity="0.16"/>
    <path d="M0,225 C240,215 420,238 640,226 S1000,220 1200,230" stroke-opacity="0.14"/>
    <path d="M0,300 C220,292 440,312 660,300 S1000,296 1200,304" stroke-opacity="0.12"/>
    <path d="M0,370 C260,362 460,380 700,368 S1020,364 1200,372" stroke-opacity="0.10"/>
  </g>
  <!-- water table -->
  <path d="M0,248 C60,242 120,254 180,248 S300,242 360,248 S480,254 540,248 S660,242 720,248 S840,254 900,248 S1020,242 1080,248 S1160,252 1200,248 L1200,420 L0,420 Z" fill="url(#hwater)"/>
  <path d="M0,248 C60,242 120,254 180,248 S300,242 360,248 S480,254 540,248 S660,242 720,248 S840,254 900,248 S1020,242 1080,248 S1160,252 1200,248" fill="none" stroke="#3fc1c9" stroke-opacity="0.7" stroke-width="1.4"/>
  <!-- well casing -->
  <g fill="none" stroke="#9be7ea" stroke-width="2">
    <path d="M840,112 L840,392"/>
    <path d="M900,112 L900,392"/>
    <path d="M830,112 L910,112"/>
    <path d="M840,392 L900,392" stroke-dasharray="4 5" stroke-opacity="0.5"/>
  </g>
  <!-- water inside casing -->
  <rect x="841" y="252" width="58" height="140" fill="#3fc1c9" fill-opacity="0.12"/>
  <!-- drop pipe and submersible pump -->
  <g fill="none" stroke="#3fc1c9" stroke-width="2">
    <path d="M870,112 L870,318"/>
    <rect x="855" y="318" width="30" height="46" rx="5"/>
    <path d="M855,332 L885,332 M855,344 L885,344" stroke-opacity="0.6"/>
    <rect x="859" y="364" width="22" height="22" rx="4"/>
  </g>
  <!-- pitless line to house, pressure tank, gauge, switch -->
  <g fill="none" stroke="#3fc1c9" stroke-width="2">
    <path d="M870,150 L720,150 L720,134"/>
    <rect x="620" y="42" width="120" height="92" rx="46" stroke="#9be7ea"/>
    <path d="M560,92 L620,92"/>
    <circle cx="540" cy="92" r="20"/>
    <path d="M540,92 L551,81" stroke-width="2"/>
    <rect x="490" y="62" width="30" height="24" rx="3" stroke-opacity="0.7"/>
    <path d="M520,74 L520,92 L520,92" stroke-opacity="0.5"/>
  </g>
  <g fill="#3fc1c9" fill-opacity="0.9">
    <circle cx="540" cy="92" r="2.6"/>
    <circle cx="870" cy="150" r="3"/>
  </g>
  <!-- flow arrows -->
  <g fill="none" stroke="#9be7ea" stroke-opacity="0.7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M870,290 l-4,8 m4,-8 l4,8"/>
    <path d="M870,220 l-4,8 m4,-8 l4,8"/>
    <path d="M800,150 l8,-4 m-8,4 l8,4"/>
  </g>
  <!-- well cap tick marks and depth scale -->
  <g stroke="#8fb4c8" stroke-opacity="0.35" stroke-width="1">
    <path d="M1010,120 L1010,392"/>
    <path d="M1002,120 L1018,120 M1002,188 L1018,188 M1002,256 L1018,256 M1002,324 L1018,324 M1002,392 L1018,392"/>
  </g>
</svg>
